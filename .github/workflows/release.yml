name: Build & Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and upload assets for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.0"

      - name: Build .app & DMG
        env:
          CI: true
          PYTHON_CMD: python3
          MB_DMG_FLAVOR: macos-intel
        run: |
          chmod +x packaging/build_dmg.sh
          ./packaging/build_dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: |
            dist/Media Browser.app
            dist/Media Browser v*.dmg

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.0"

      - name: Build .app & DMG
        env:
          CI: true
          PYTHON_CMD: python3
          MB_DMG_FLAVOR: macos-arm64
        run: |
          chmod +x packaging/build_dmg.sh
          ./packaging/build_dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            dist/Media Browser.app
            dist/Media Browser v*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg (static)
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath .\ffmpeg_temp -Force
          $bin = Get-ChildItem -Path .\ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $probe = Get-ChildItem -Path .\ffmpeg_temp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $bin.FullName -Destination .\ffmpeg.exe
          Copy-Item $probe.FullName -Destination .\ffprobe.exe
          $env:PATH = "$PWD;$env:PATH"
          echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Verify ffmpeg
        run: ffmpeg -version

      - name: Install PyInstaller
        run: pip install "pyinstaller>=6.0"

      - name: Resolve app version
        id: appver
        shell: pwsh
        run: |
          $m = Select-String -Path media_browser.py -Pattern 'APP_VERSION = "([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "APP_VERSION not found in media_browser.py" }
          $v = $m.Matches.Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build with PyInstaller (onedir)
        run: |
          python -m PyInstaller --onedir --name MediaBrowser --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --clean -y media_browser.py
        shell: cmd

      - name: Copy ffmpeg to dist
        run: |
          Copy-Item ffmpeg.exe dist\MediaBrowser\
          Copy-Item ffprobe.exe dist\MediaBrowser\
          (Get-Content packaging\README-WINDOWS.txt -Raw).Replace("VERSION", "${{ env.VERSION }}") |
            Set-Content -Path dist\MediaBrowser\README-WINDOWS.txt -Encoding UTF8
        shell: pwsh

      - name: Sign Windows app if certificate is configured
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGN_CERT_BASE64)) {
            Write-Host "WINDOWS_CODE_SIGN_CERT_BASE64 is not configured; Windows artifact will be unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "media-browser-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          $exe = "dist\MediaBrowser\MediaBrowser.exe"
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:WINDOWS_CODE_SIGN_CERT_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          & $signtool.FullName verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed with exit code $LASTEXITCODE" }
        shell: pwsh

      - name: Create ZIP
        run: |
          $dist = "dist\MediaBrowser"
          $ver = "${{ env.VERSION }}"
          $zip = "dist\MediaBrowser-v${ver}-windows.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

      - name: Print build logs on failure
        if: failure()
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.txt" | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName -ErrorAction SilentlyContinue
          }
        shell: pwsh

  release:
    needs: [build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/macos-intel/**/*.dmg
            artifacts/macos-arm/**/*.dmg
            artifacts/windows/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
