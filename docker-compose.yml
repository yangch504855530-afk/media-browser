# Media Browser — Docker 部署
#
# 项目目录（本机路径）：/vol1/1000/handle-pri/media-browser
# 内含：media_browser.py、Dockerfile、docker-compose.yml；缩略图缓存在同级的 cache/ 子目录。
# 在此目录执行：docker compose up -d --build
#
# 扫描根在容器内固定为 /scan；MB_SCAN_PRESETS 列出页内可切换的媒体库。
#
# ★ 宿主机路径与渲染组 GID 已改为环境变量（见下方 volumes / group_add），
#   默认值即作者当前 NAS 布局，可直接使用；换机器时复制 .env.example 为 .env 再按需修改，
#   或命令行临时注入，例如：
#     MB_CACHE_HOST_DIR=/your/cache \
#     MB_TMP_HOST_DIR=/your/tmp \
#     MB_TORRENT_HOST_DIR=/your/torrent \
#     MB_RENDER_GID=103 \
#     MB_ACCESS_TOKEN='...' \
#     docker compose up -d --build
#
# 首次建议先创建宿主机缓存目录：
#   mkdir -p "/vol1/1000/handle-pri/media-browser/cache"
#
# 权限说明：
#   容器默认以 uid=1000 运行。如果宿主机你的用户 UID 不是 1000，
#   请取消下面 user 行的注释，并替换为你的 UID/GID：
#     id -u   # 查看 UID
#     id -g   # 查看 GID

services:
  media-browser:
    build:
      context: .
      args:
        # 构建阶段 apt 源；若仍失败可改为 mirrors.ustc.edu.cn 或留空 "" 直连 deb.debian.org
        APT_MIRROR: mirrors.aliyun.com
    image: media-browser:local
    container_name: media-browser
    restart: unless-stopped
    # 如宿主机 UID/GID 不是 1000:1000，请取消下行注释并修改
    # user: "1000:1000"
    # Intel/AMD 核显硬转：宿主机 getent group render → 填入 group_add（G4600 示例为 105）
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${MB_RENDER_GID:-105}"
    ports:
      - "8765:8765"
    environment:
      MB_ROOT_DIR: /scan
      MB_SCAN_PRESETS: "/scan|全部;/scan/tmp|tmp 审阅;/scan/torrent|自动下载"
      MB_AUTO_SCAN: "0"
      # 缩略图缓存：宿主机 …/media-browser/cache → 容器 /cache
      MB_CACHE_DIR: /cache
      MB_HOST: "0.0.0.0"
      # 非本机监听必须设置访问令牌：先执行 export MB_ACCESS_TOKEN='足够长的随机字符串'
      MB_ACCESS_TOKEN: "${MB_ACCESS_TOKEN:?Set MB_ACCESS_TOKEN before docker compose up}"
      MB_PORT: "8765"
      # 机械盘 / 大库：保守并发与条带帧数（可按观察再调大）
      MB_DISK_PROFILE: nas
      MB_SCAN_WORKERS: "1"
      MB_THUMB_COUNT: "2"
      MB_SCAN_ROOT_READONLY: "1"
      # 核显硬转：auto=探测 VAAPI；无 GPU 时自动回退 CPU。宿主机 getent group render → group_add
      MB_FFMPEG_HW: "auto"
      # 可选：MB_LOG_FORMAT=json
      TZ: Asia/Shanghai
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request as u; r=u.urlopen('http://127.0.0.1:8765/health', timeout=5); import sys; sys.exit(0 if r.status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    volumes:
      - "${MB_CACHE_HOST_DIR:-/vol1/1000/handle-pri/media-browser/cache}:/cache"
      - "${MB_TMP_HOST_DIR:-/vol3/1000/handle-3T-cun3/tmp}:/scan/tmp"
      - "${MB_TORRENT_HOST_DIR:-/vol3/1000/handle-3T-cun3/torrent/auto-down}:/scan/torrent"
