<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Media Browser</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c1e;
            --card-border: #2c2c2e;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #0a84ff;
            --accent-hover: #0071e3;
            --error-bg: rgba(255, 69, 58, 0.15);
            --error-text: #ff453a;
            --input-bg: #2c2c2e;
            --input-border: #3a3a3c;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(10, 132, 255, 0.35);
        }

        .logo-icon svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
        }

        .form-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 24px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .form-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-alert {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 13px;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }

        .error-alert.visible {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/>
                </svg>
            </div>
            <h1>Media Browser</h1>
            <p>请登录以继续审阅媒体库</p>
        </div>

        <div id="errorAlert" class="error-alert">
            <span id="errorMessage">账号或密码错误</span>
        </div>

        <form id="loginForm" method="POST" action="/api/login">
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="请输入账号" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <label class="form-remember">
                <input type="checkbox" id="remember" name="remember" value="1" checked>
                <span>保持登录状态（此设备 1 年免密）</span>
            </label>

            <button type="submit" id="submitBtn" class="btn-submit">登 录</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.textContent = '正在登录...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.ok) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || '账号或密码错误';
                    errorAlert.classList.add('visible');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '登 录';
                }
            } catch (err) {
                errorMessage.textContent = '网络请求失败，请稍后重试';
                errorAlert.classList.add('visible');
                submitBtn.disabled = false;
                submitBtn.textContent = '登 录';
            }
        });
    </script>
</body>
</html>
